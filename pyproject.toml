[build-system]
requires = [
    "hatchling>=1.4.1",
]
build-backend = "hatchling.build"

[tool.hatch.build]
include = [
    "dotbot/frontend/*",
    "dotbot/*.toml",
    "*.py"
]
exclude = [
    "dotbot/frontend/node_modules",
    "utils/"
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.sdist.hooks.custom]
path = "utils/hooks/sdist.py"

[project]
name = "pydotbot"
version = "0.29.0rc2"
authors = [
    { name="Alexandre Abadie", email="alexandre.abadie@inria.fr" },
    { name="Theo Akbas", email="theo.akbas@inria.fr" },
    { name="Filip Maksimovic", email="filip.maksimovic@inria.fr" },
    { name="Said Alvarado-Marin", email="said-alexander.alvarado-marin@inria.fr" },
    { name="Mališa Vučinić", email="malisa.vucinic@inria.fr" },
    { name="Diego Badillo", email="diego.badillo@sansano.usm.cl" },
    { name="Geovane Fedrecheski", email="geovane.fedrecheski@inria.fr" },
]
dependencies = [
    "click          >= 8.1.7",
    "fastapi        >= 0.115.0",
    "httpx          >= 0.27.2",
    "numpy          >= 2.1.1",
    "pygame         >= 2.6.1",
    "pynput         >= 1.8.1",
    "pyserial       >= 3.5",
    "qrkey          >= 0.12.2",
    "rich           >= 14.0.0",
    "structlog      >= 24.4.0",
    "uvicorn        >= 0.32.0",
    "websockets     >= 13.1.0",
    "gmqtt          >= 0.7.0",
    "intelhex       >= 2.3.0",
    "marilib-pkg    >= 0.9.0rc3",
    "pydotbot-utils >= 0.3.0",
    "swarmit        >= 0.8.0rc2",
    "toml           >= 0.10.2",
    "tomlkit        >= 0.13.0",
]
description = "Package to easily control your DotBots and SailBots."
readme = "README.md"
license = { text="BSD" }
requires-python = ">=3.7"
classifiers = [
    'Programming Language :: C',
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: BSD License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
]

[project.urls]
"Homepage" = "https://github.com/DotBots/PyDotBot"
"Bug Tracker" = "https://github.com/DotBots/PyDotBot/issues"

[project.scripts]
# The unified dispatcher is the only console script. Every workflow is a
# `dotbot <group> <verb>` subcommand — there are no per-command `dotbot-*`
# binaries.
dotbot = "dotbot.cli.main:cli"

[project.optional-dependencies]
# Optional subcommand backends. Keep the core install lean; opt in to
# the bits you actually use.
calibrate = [
    "opencv-python    >= 4.12.0.88",
    "textual          >= 6.4.0",
]
all = [
    "opencv-python    >= 4.12.0.88",
    "textual          >= 6.4.0",
]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "ruff",
    "black",
    "isort",
    "pre-commit",
]

[tool.ruff]
lint.select = ["E", "F"]
line-length = 88
lint.ignore = ["E501"]

[tool.isort]
multi_line_output = 3  # Use Vertical Hanging Indent
profile = "black"
