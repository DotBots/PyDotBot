# The AIO hall for the 500-robot simulation, loaded with `dotbot -c site.toml`.
# Zero is the top-left corner of the extent, x right, y down, millimetres.
# The extent and the arena are the testbed's placeholder numbers for the hall.
site = "inria-aio-c"

[sites.inria-aio-c]
anchor = "the north-west corner of the hall's floor marking"
extent_mm = [20000, 30000]

[sites.inria-aio-c.areas.arena]      # a 2 x 2 m square inside the hall
x = 5000
y = 5000
w = 2000
h = 2000

[sites.inria-aio-c.areas.staging]    # a 2 m strip along the north wall
x = 0
y = 0
w = 20000
h = 2000

[sites.inria-aio-c.areas.field]      # the main field, where the robots start
x = 2000
y = 10000
w = 16000
h = 16000

[sites.inria-aio-c.areas.charging]   # a 2 m strip along the south wall
x = 0
y = 28000
w = 20000
h = 2000
