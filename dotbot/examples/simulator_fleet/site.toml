# A 20 x 30 m hall for fleet simulations, loaded with `dotbot -c site.toml`.
# Zero is the top-left corner of the extent, x right, y down, millimetres.
site = "sim-hall"

[sites.sim-hall]
anchor = "the north-west corner of the hall's floor marking"
extent_mm = [20000, 30000]

[sites.sim-hall.areas.staging]    # a 2 m strip along the north wall
x = 0
y = 0
w = 20000
h = 2000

[sites.sim-hall.areas.field]      # the field, where the robots start
x = 2000
y = 10000
w = 16000
h = 16000

[sites.sim-hall.areas.charging]   # a 2 m strip along the south wall
role = "staging"
x = 0
y = 28000
w = 20000
h = 2000
