# A broker for the playground demos: one plain listener for the scripts, one
# websockets listener for the page, both anonymous.
#
#   mosquitto -c dotbot/examples/follow/mosquitto.conf
#
# 1883 is MQTT's registered port and 1884 is the websockets port qrkey's UI
# already assumes, so a page with no ?broker= query finds this by itself. If
# either is taken - a broker is already running for the real testbed, say -
# shift both by ten and pass the new ones through:
#
#   python -m dotbot.examples.follow --broker mqtt://localhost:1893
#   /playground/?world=controller&broker=ws://localhost:1894/mqtt
#
# Anonymous access is the lab-local story. Once a demo leaves the room the
# testbed topics go behind a user and password and the app topics go behind
# qrkey; neither is configured here.
persistence false
log_type error
log_type warning
log_type notice

listener 1883
protocol mqtt
allow_anonymous true

listener 1884
protocol websockets
allow_anonymous true
