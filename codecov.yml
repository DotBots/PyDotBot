# Codecov config — the gate belongs on the Python control plane, not on the
# web console.
#
# Coverage arrives from two uploads (pytest and the console's vitest).
# Untagged they merge into one project total, so adding a few thousand lines
# of thinly-covered TS drags the number down and fails a PR that did nothing to
# the Python. Flags keep the two apart.
#
# The console is reported but never blocks: its vitest suite covers the pure
# logic (state merge, mission grouping, SSE parsing, the drive mixing) and
# deliberately not the rendering, so its absolute number is low by design and
# says little about whether a change is safe.

flags:
  python:
    paths:
      - dotbot/
      - utils/
    carryforward: true
  console:
    paths:
      - dotbot/console-web/
    carryforward: true

coverage:
  status:
    project:
      # No unflagged aggregate status: that is the one that mixed the two.
      default: false
      python:
        flags:
          - python
        # Compare against main's current coverage. Allow tiny dips
        # (rounding / one-off branches) without flapping CI.
        target: auto
        threshold: 1%
      web:
        flags:
          - console
        # Reported in the PR comment, never a CI gate.
        informational: true
    patch:
      default:
        # Report patch coverage but don't fail CI on it. Reviewers can
        # still see the number in the PR comment; the gate just lives
        # in human judgment instead of a hard threshold.
        informational: true

comment:
  layout: "reach, diff, flags, files"
  behavior: default
  require_changes: false
