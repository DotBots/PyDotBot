[tool:pytest]
addopts = -vv -s
          --color=yes
          --doctest-modules
          --cov=dotbot
          --cov-config=setup.cfg
          --cov-report=term
          --cov-report=term-missing
          --cov-report=xml
          --ignore=dotbot/calibration
testpaths = dotbot
asyncio_default_fixture_loop_scope = function

# Why --ignore dotbot/calibration: --doctest-modules walks every .py file
# to find doctests, importing each. dotbot/calibration/* imports textual +
# cv2, gated behind the [calibrate] extra for size reasons; the CI test env
# doesn't install it, so doctest discovery crashes on import. It has no
# doctests, so the ignore only skips import-failure noise; its real tests
# live in dotbot/tests/. (dotbot/firmware/* needs no ignore — its sole
# optional dep, intelhex, is now a core dependency.)

[coverage:run]
# dotbot/firmware/* is the hardware flash engine vendored from the
# standalone dotbot-provision package (and dotbot/calibration from
# dotbot-lh2-calibration); both shipped with ~0% host-test coverage and
# most of their logic is HIL-only. Excluded from coverage so the vendored
# bytes don't tank the signal for the rest of the codebase. Real host
# tests for the unit-testable parts are tracked as a separate follow-up.
omit =
    dotbot/calibration/*
    dotbot/firmware/*

[tool.black]
line-length = 79
skip-string-normalization = true
