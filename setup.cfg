[tool:pytest]
addopts = -vv -s
          --color=yes
          --doctest-modules
          --cov=dotbot
          --cov-config=setup.cfg
          --cov-report=term
          --cov-report=term-missing
          --cov-report=xml
          --ignore=dotbot/calibration
          --ignore=dotbot/provision
testpaths = dotbot
asyncio_default_fixture_loop_scope = function

# Why --ignore these dirs: --doctest-modules walks every .py file to find
# doctests, importing each. dotbot/calibration/* import textual + cv2 and
# dotbot/provision/cli.py optionally needs intelhex — all gated behind
# extras ([calibrate], [provision]) for size reasons. The CI test env
# doesn't install those extras, so doctest discovery crashes on import.
# Neither vendored package has doctests today, so the only thing the
# ignores skip is import-failure noise. Tests for these packages live
# in dotbot/tests/ and are collected normally.

[coverage:run]
# Vendored from standalone PyPI packages (dotbot-provision,
# dotbot-lh2-calibration) that themselves shipped with ~0% test
# coverage. Folding them in shouldn't tank dotbot-python's reported
# coverage just because the vendored bytes appear in the diff. Real
# tests for these modules are tracked as a separate follow-up; until
# they land, the modules are excluded from coverage to keep the
# signal honest for the rest of the codebase.
omit =
    dotbot/calibration/*
    dotbot/provision/*

[tool.black]
line-length = 79
skip-string-normalization = true
